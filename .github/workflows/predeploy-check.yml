name: Predeploy Check

on:
  push:
    branches:
      - main
      - agent/final-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Resolve dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit resolved lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh lockfile for vinext hydration fix"
          git push origin HEAD:main

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

      - name: Lint
        run: pnpm run lint

      - name: Install browser smoke-test runner
        run: |
          pnpm add -D @playwright/test@1.55.0 --ignore-workspace-root-check
          pnpm exec playwright install chromium

      - name: Start production server
        run: |
          SUPABASE_URL=https://ci-test.supabase.co \
          SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-000000000000000000000000 \
          AUTH_SESSION_SECRET=ci-auth-session-secret-000000000000000000000000000000000000 \
          AUTH_REQUIRED=false \
          PORT=3000 \
          pnpm exec vinext start --hostname 127.0.0.1 > /tmp/couponshare-server.log 2>&1 &
          echo $! > /tmp/couponshare-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/couponshare-server.log
          exit 1

      - name: Browser hydration smoke tests
        env:
          CI_AUTH_SESSION_SECRET: ci-auth-session-secret-000000000000000000000000000000000000
        run: |
          cat > hydration-ci.spec.mjs <<'EOF'
          import crypto from "node:crypto";
          import { test, expect } from "@playwright/test";

          const BASE_URL = "http://127.0.0.1:3000";

          function browserDiagnostics(page) {
            const pageErrors = [];
            const failedAssets = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));
            page.on("response", (response) => {
              const url = response.url();
              if ((url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) && response.status() >= 400) {
                failedAssets.push(`${response.status()} ${url}`);
              }
            });
            page.on("requestfailed", (request) => {
              const url = request.url();
              if (url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) {
                failedAssets.push(`FAILED ${url}`);
              }
            });
            return { pageErrors, failedAssets };
          }

          function browseToken(secret) {
            const issuedAt = Date.now();
            const expiresAt = issuedAt + 12 * 60 * 60 * 1000;
            const payload = `browse.${issuedAt}.${expiresAt}`;
            const signature = crypto
              .createHmac("sha256", `couponshare-auth-session-v1:${secret}`)
              .update(payload)
              .digest("base64url");
            return `${payload}.${signature}`;
          }

          test("login production client hydrates and handles clicks", async ({ page }) => {
            const { pageErrors, failedAssets } = browserDiagnostics(page);

            await page.goto(`${BASE_URL}/login`, { waitUntil: "networkidle" });
            await expect(page.getByText("로그인", { exact: true }).first()).toBeVisible();
            await page.getByRole("button", { name: "회원가입", exact: true }).click();
            await expect(page.getByText("비밀번호 확인", { exact: true })).toBeVisible();

            expect(pageErrors, `page errors: ${pageErrors.join(" | ")}`).toEqual([]);
            expect(failedAssets, `failed assets: ${failedAssets.join(" | ")}`).toEqual([]);
          });

          test("Dunnes page hydrates, loads voucher data and handles controls", async ({ page, context }) => {
            const { pageErrors, failedAssets } = browserDiagnostics(page);
            const token = browseToken(process.env.CI_AUTH_SESSION_SECRET);
            await context.addCookies([{
              name: "couponshare_browse_v1",
              value: token,
              url: BASE_URL,
              httpOnly: true,
              secure: false,
              sameSite: "Lax",
            }]);

            await page.route("**/api/dunnes-vouchers**", async (route) => {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  vouchers: [{
                    id: "11111111-1111-4111-8111-111111111111",
                    voucher_type: "5off25",
                    barcode_masked: "•••• 1234",
                    image_data: null,
                    membership_required: false,
                    membership_image_data: null,
                    expires_on: "2026-09-03",
                    status: "available",
                    review_status: "approved",
                    is_mine: false,
                    reserved_by_me: false,
                    reserved_until: null,
                  }],
                  reservationsRemaining: 3,
                }),
              });
            });

            await page.goto(`${BASE_URL}/dunnes`, { waitUntil: "networkidle" });
            await expect(page.getByText("불러오는 중", { exact: true })).toHaveCount(0, { timeout: 10000 });
            await expect(page.getByText("2026-09-03 만료 · •••• 1234", { exact: true })).toBeVisible();

            const fifty = page.getByRole("tab", { name: "€50 이상" });
            await fifty.click();
            await expect(fifty).toHaveAttribute("aria-selected", "true");

            const menu = page.getByRole("button", { name: "메뉴 열기" });
            await menu.click();
            await expect(page.locator("#couponshare-app-menu")).toHaveAttribute("aria-hidden", "false");

            expect(pageErrors, `page errors: ${pageErrors.join(" | ")}`).toEqual([]);
            expect(failedAssets, `failed assets: ${failedAssets.join(" | ")}`).toEqual([]);
          });
          EOF
          pnpm exec playwright test hydration-ci.spec.mjs --reporter=line --workers=1

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/couponshare-server.log || true
