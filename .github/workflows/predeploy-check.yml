name: Predeploy Check

on:
  push:
    branches:
      - main
      - agent/final-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: couponshare
          POSTGRES_PASSWORD: couponshare
          POSTGRES_DB: couponshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U couponshare -d couponshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://couponshare:couponshare@127.0.0.1:5432/couponshare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

      - name: Lint
        run: pnpm run lint

      - name: Prepare Dunnes integration database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;

          create table profiles (
            id uuid primary key default gen_random_uuid(),
            device_key uuid not null unique,
            auth_user_id uuid unique,
            is_blocked boolean not null default false,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table dunnes_vouchers (
            id uuid primary key default gen_random_uuid(),
            owner_id uuid not null references profiles(id) on delete cascade,
            voucher_type text not null,
            barcode text not null unique,
            image_data text,
            membership_required boolean not null default false,
            membership_image_data text,
            expires_on date not null,
            status text not null default 'available',
            review_status text not null default 'approved',
            reserved_by uuid references profiles(id) on delete set null,
            reserved_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table dunnes_daily_reservations (
            profile_id uuid not null references profiles(id) on delete cascade,
            usage_date date not null,
            reservation_count integer not null default 0,
            updated_at timestamptz not null default now(),
            primary key (profile_id, usage_date)
          );

          insert into profiles (id, device_key)
          values (
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
          );

          insert into dunnes_vouchers (
            id,
            owner_id,
            voucher_type,
            barcode,
            image_data,
            membership_required,
            expires_on,
            status,
            review_status
          ) values (
            '11111111-1111-4111-8111-111111111111',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            '5off25',
            '12345678901234',
            'data:image/png;base64,AA==',
            false,
            '2099-09-03',
            'available',
            'approved'
          );
          SQL

      - name: Install browser test runner
        run: |
          pnpm add -D @playwright/test@1.55.0 --ignore-workspace-root-check --lockfile=false
          pnpm exec playwright install chromium

      - name: Start local production server
        run: |
          SUPABASE_URL=https://ci-test.supabase.co \
          SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-000000000000000000000000 \
          AUTH_SESSION_SECRET=ci-auth-session-secret-000000000000000000000000000000000000 \
          AUTH_REQUIRED=false \
          PORT=3000 \
          pnpm exec vinext start --hostname 127.0.0.1 > /tmp/couponshare-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/couponshare-server.log
          exit 1

      - name: Local production browser tests
        env:
          CI_AUTH_SESSION_SECRET: ci-auth-session-secret-000000000000000000000000000000000000
        run: pnpm exec playwright test tests/e2e/dunnes-production.spec.mjs --reporter=line --workers=1

      - name: Wait for live deployment marker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          production_url="https://couponshare-ireland-493377120974.europe-west1.run.app"
          for attempt in {1..72}; do
            body="$(curl -fsS --max-time 10 "$production_url/api/build-info" 2>/dev/null || true)"
            echo "Attempt $attempt: $body"
            if printf '%s' "$body" | grep -q 'hydration-fix-beta8-20260828'; then
              exit 0
            fi
            sleep 10
          done
          echo "The expected production release marker did not appear."
          exit 1

      - name: Live Cloud Run client hydration test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec playwright test tests/e2e/live-client.spec.mjs --reporter=line --workers=1

      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/couponshare-server.log || true
