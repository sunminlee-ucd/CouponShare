name: Predeploy Check

on:
  push:
    branches:
      - main
      - agent/final-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

      - name: Lint
        run: pnpm run lint

      - name: Install browser smoke-test runner
        run: |
          pnpm add -D @playwright/test@1.55.0 --ignore-workspace-root-check --lockfile=false
          pnpm exec playwright install chromium

      - name: Start local production server
        run: |
          SUPABASE_URL=https://ci-test.supabase.co \
          SUPABASE_PUBLISHABLE_KEY=ci-publishable-key-000000000000000000000000 \
          AUTH_SESSION_SECRET=ci-auth-session-secret-000000000000000000000000000000000000 \
          AUTH_REQUIRED=false \
          PORT=3000 \
          pnpm exec vinext start --hostname 127.0.0.1 > /tmp/couponshare-server.log 2>&1 &
          echo $! > /tmp/couponshare-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/couponshare-server.log
          exit 1

      - name: Local browser hydration tests
        env:
          CI_AUTH_SESSION_SECRET: ci-auth-session-secret-000000000000000000000000000000000000
        run: |
          cat > hydration-ci.spec.mjs <<'EOF'
          import crypto from "node:crypto";
          import { test, expect } from "@playwright/test";

          const BASE_URL = "http://127.0.0.1:3000";

          function browserDiagnostics(page) {
            const pageErrors = [];
            const failedAssets = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));
            page.on("response", (response) => {
              const url = response.url();
              if ((url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) && response.status() >= 400) {
                failedAssets.push(`${response.status()} ${url}`);
              }
            });
            page.on("requestfailed", (request) => {
              const url = request.url();
              if (url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) {
                failedAssets.push(`FAILED ${url}`);
              }
            });
            return { pageErrors, failedAssets };
          }

          function browseToken(secret) {
            const issuedAt = Date.now();
            const expiresAt = issuedAt + 12 * 60 * 60 * 1000;
            const payload = `browse.${issuedAt}.${expiresAt}`;
            const signature = crypto
              .createHmac("sha256", `couponshare-auth-session-v1:${secret}`)
              .update(payload)
              .digest("base64url");
            return `${payload}.${signature}`;
          }

          test("login production client hydrates and handles clicks", async ({ page }) => {
            const { pageErrors, failedAssets } = browserDiagnostics(page);
            await page.addInitScript(() => localStorage.setItem("couponshare-language-v1", "en"));

            await page.goto(`${BASE_URL}/login`, { waitUntil: "domcontentloaded" });
            await expect(page.getByRole("button", { name: "Sign up", exact: true })).toBeVisible();
            await page.getByRole("button", { name: "Sign up", exact: true }).click();
            await expect(page.getByText("Confirm password", { exact: true })).toBeVisible();

            expect(pageErrors, `page errors: ${pageErrors.join(" | ")}`).toEqual([]);
            expect(failedAssets, `failed assets: ${failedAssets.join(" | ")}`).toEqual([]);
          });

          test("Dunnes page hydrates, requests voucher data and handles controls", async ({ page, context }) => {
            const { pageErrors, failedAssets } = browserDiagnostics(page);
            let voucherRequests = 0;
            const token = browseToken(process.env.CI_AUTH_SESSION_SECRET);

            await context.addCookies([{
              name: "couponshare_browse_v1",
              value: token,
              url: BASE_URL,
              httpOnly: true,
              secure: false,
              sameSite: "Lax",
            }]);
            await page.addInitScript(() => localStorage.setItem("couponshare-language-v1", "en"));

            await page.route("**/api/dunnes-vouchers**", async (route) => {
              voucherRequests += 1;
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  vouchers: [{
                    id: "11111111-1111-4111-8111-111111111111",
                    voucher_type: "5off25",
                    barcode_masked: "masked-1234",
                    image_data: null,
                    membership_required: false,
                    membership_image_data: null,
                    expires_on: "2026-09-03",
                    status: "available",
                    review_status: "approved",
                    is_mine: false,
                    reserved_by_me: false,
                    reserved_until: null,
                  }],
                  reservationsRemaining: 3,
                }),
              });
            });

            await page.goto(`${BASE_URL}/dunnes`, { waitUntil: "domcontentloaded" });
            await expect.poll(() => voucherRequests, { timeout: 10000 }).toBeGreaterThan(0);
            await expect(page.getByText(/2026-09-03.*masked-1234/)).toBeVisible({ timeout: 10000 });
            expect(await page.getByText("Loading", { exact: true }).count()).toBe(0);

            const fifty = page.getByRole("tab", { name: "€50 or more" });
            await fifty.click();
            await expect(fifty).toHaveAttribute("aria-selected", "true");

            const menu = page.getByRole("button", { name: "Open menu" });
            await menu.click();
            await expect(page.locator("#couponshare-app-menu")).toHaveAttribute("aria-hidden", "false");

            expect(pageErrors, `page errors: ${pageErrors.join(" | ")}`).toEqual([]);
            expect(failedAssets, `failed assets: ${failedAssets.join(" | ")}`).toEqual([]);
          });
          EOF
          pnpm exec playwright test hydration-ci.spec.mjs --reporter=line --workers=1

      - name: Wait for live deployment marker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          production_url="https://couponshare-ireland-493377120974.europe-west1.run.app"
          for attempt in {1..72}; do
            body="$(curl -fsS --max-time 10 "$production_url/api/build-info" 2>/dev/null || true)"
            echo "Attempt $attempt: $body"
            if printf '%s' "$body" | grep -q 'hydration-fix-beta8-20260828'; then
              exit 0
            fi
            sleep 10
          done
          echo "The expected production release marker did not appear."
          exit 1

      - name: Live Cloud Run client hydration test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > live-hydration-ci.spec.mjs <<'EOF'
          import { test, expect } from "@playwright/test";

          const URL = "https://couponshare-ireland-493377120974.europe-west1.run.app/diagnostics/client";

          test("deployed Cloud Run client hydrates and handles clicks", async ({ page }) => {
            const pageErrors = [];
            const failedAssets = [];
            page.on("pageerror", (error) => pageErrors.push(error.message));
            page.on("response", (response) => {
              const url = response.url();
              if ((url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) && response.status() >= 400) {
                failedAssets.push(`${response.status()} ${url}`);
              }
            });
            page.on("requestfailed", (request) => {
              const url = request.url();
              if (url.includes("/_next/") || url.includes("/_vinext/") || url.includes("/assets/")) {
                failedAssets.push(`FAILED ${url}`);
              }
            });

            await page.goto(URL, { waitUntil: "domcontentloaded" });
            await expect(page.getByTestId("client-phase")).toHaveText("hydrated", { timeout: 15000 });
            await page.getByRole("button", { name: "Increment" }).click();
            await expect(page.getByTestId("click-count")).toHaveText("1");

            expect(pageErrors, `page errors: ${pageErrors.join(" | ")}`).toEqual([]);
            expect(failedAssets, `failed assets: ${failedAssets.join(" | ")}`).toEqual([]);
          });
          EOF
          pnpm exec playwright test live-hydration-ci.spec.mjs --reporter=line --workers=1

      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/couponshare-server.log || true
